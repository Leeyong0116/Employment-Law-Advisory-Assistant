[project]
name = "malaysian-labour-rag"
version = "0.1.0"
description = "RAG over Malaysian labour statutes with per-section citation and abstention"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "corpus: requires the source PDFs in data/raw (skipped if absent)",
    "slow: takes more than a couple of seconds",
]
